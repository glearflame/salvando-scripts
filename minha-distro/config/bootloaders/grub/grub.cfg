set gfxmode=auto
insmod png
background_image /boot/grub/wallpaper.png
set timeout=5
set default=0

menuentry "Experimentar ou Instalar LW Hacking OS" {
    linux /live/vmlinuz boot=live components username=lonewys hostname=lw-hacking quiet splash
    initrd /live/initrd.img
}

menuentry "Experimentar ou Instalar LW Hacking OS (Graficos Seguros)" {
    linux /live/vmlinuz boot=live components username=lonewys hostname=lw-hacking nomodeset
    initrd /live/initrd.img
}

menuentry "Modo Live Persistente (USB)" {
    linux /live/vmlinuz boot=live persistence persistence-label=LW-PERSISTENCE components username=lonewys hostname=lw-hacking quiet splash
    initrd /live/initrd.img
}

menuentry "Reboot" {
    reboot
}

menuentry "Shutdown" {
    halt
}
